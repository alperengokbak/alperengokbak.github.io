name: Sync blog posts from Medium

on:
  schedule:
    # 05:15 UTC daily. Off the hour to avoid GitHub's busiest scheduling slots.
    - cron: '15 5 * * *'
  workflow_dispatch:

# Only what the commit needs.
permissions:
  contents: write

concurrency:
  group: 'sync-blogs'
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync from Medium RSS
        run: node scripts/sync-blogs.mjs

      - name: Verify the site still builds with the new data
        run: |
          npm run lint
          npm run test:run
          npm run build

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain src/data/blogs.generated.js src/assets/blog-covers/generated)" ]; then
            echo "No blog changes."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/blogs.generated.js src/assets/blog-covers/generated

          # GITHUB_TOKEN pushes do not trigger other workflows, so this cannot loop
          # into deploy.yml. Deployment happens on the next real push, or dispatch
          # "Deploy static content to Pages" manually to publish immediately.
          git commit -m "chore: sync blog posts from Medium"
          git push
